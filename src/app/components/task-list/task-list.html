<div class="contenedor">
  <button class="boton" (click)="alternarMensaje()">
    Mostrar / Ocultar mensaje
  </button>

  <div class="mensaje" *ngIf="mostrarMensaje">
    <p>¡Organiza tus actividades y cumple tus metas de estudio!</p>
  </div>

  <div class="tarjeta">
    <h3>Actividades académicas</h3>

    <div class="tarea" *ngFor="let actividad of actividades">
      <h4>{{ actividad.materia }}</h4>
      <p><strong>Actividad:</strong> {{ actividad.actividad }}</p>
      <p><strong>Prioridad:</strong> {{ actividad.prioridad }}</p>
      <p [ngClass]="actividad.completada ? 'completada' : 'pendiente'">
        Estado: {{ actividad.completada ? 'Completada' : 'Pendiente' }}
      </p>

      <button class="boton-secundario" (click)="cambiarEstado(actividad)">
        Cambiar estado
      </button>
    </div>
  </div>
</div>
